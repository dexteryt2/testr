name: claude_pool_app
description: Multi-account claude.ai session pool — self-contained APK
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State
  provider: ^6.1.2

  # Database
  sqflite: ^2.3.3
  path: ^1.9.0

  # HTTP (with SOCKS5 proxy support)
  http: ^1.2.1
  socks5_proxy: ^1.0.4

  # WebView for Google login + cookie extraction
  flutter_inappwebview: ^6.0.0

  # File system
  path_provider: ^2.1.3

  # Preferences
  shared_preferences: ^2.2.3

  # Utils
  uuid: ^4.4.0
  intl: ^0.19.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/xray-arm64-v8a
    - assets/icon/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
