name: Build APK (ARM64)
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Download Xray ARM64
        run: |
          wget -q "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-android-arm64-v8a.zip" -O /tmp/xray.zip
          unzip -j /tmp/xray.zip xray -d assets/
          mv assets/xray assets/xray-arm64-v8a
          chmod +x assets/xray-arm64-v8a
          echo "Xray: $(ls -lh assets/xray-arm64-v8a)"

      - name: Download Vazirmatn font
        run: |
          mkdir -p assets/fonts
          wget -q "https://github.com/rastikerdar/vazirmatn/raw/master/fonts/ttf/Vazirmatn-Regular.ttf" -O assets/fonts/Vazirmatn-Regular.ttf || true
          wget -q "https://github.com/rastikerdar/vazirmatn/raw/master/fonts/ttf/Vazirmatn-Bold.ttf" -O assets/fonts/Vazirmatn-Bold.ttf || true
          ls -la assets/fonts/

      - name: Create app icon
        run: |
          mkdir -p assets/icon
          python3 -c "
          import struct, zlib
          def png(w,h,c):
            def ch(t,d):
              r=struct.pack('>I',len(d))+t+d
              return r+struct.pack('>I',zlib.crc32(r[4:])&0xffffffff)
            raw=b''.join(b'\x00'+bytes(c)*w for _ in range(h))
            return b'\x89PNG\r\n\x1a\n'+ch(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+ch(b'IDAT',zlib.compress(raw))+ch(b'IEND',b'')
          open('assets/icon/app_icon.png','wb').write(png(512,512,(108,99,255)))
          print('icon created')
          "

      - name: Flutter pub get
        run: flutter pub get

      - name: Build ARM64 APK
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --build-name="1.0.${{ github.run_number }}" \
            --build-number=${{ github.run_number }}

      - name: Package APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             dist/claude-pool-arm64-v${{ github.run_number }}.apk
          echo "APK: $(ls -lh dist/)"

      - uses: actions/upload-artifact@v4
        with:
          name: claude-pool-apk
          path: dist/claude-pool-arm64-v${{ github.run_number }}.apk
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/claude-pool-arm64-v${{ github.run_number }}.apk
          name: Claude Pool ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
